<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Smiths – There Is A Light That Never Goes Out</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <audio id="audio" src="The Smiths - There Is A Light That Never Goes Out.mp3" preload="auto"></audio>
  
  <div id="particles-js"></div>
  
  <div class="neon-lines"></div>
  
  <div class="color-waves"></div>
  
  <div class="scene">
    <div class="title-container">
      <h1 class="rainbow-title">THERE IS A LIGHT</h1>
      <h2 class="rainbow-subtitle">THAT NEVER GOES OUT</h2>
      <div class="title-decoration">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="player-container">
      <div class="player-glow"></div>
      <div class="player">
        <div class="cassette">
          <div class="cassette-window">
            <div class="tape-reels">
              <div class="tape-reel left"></div>
              <div class="tape-reel right"></div>
              <div class="tape"></div>
            </div>
          </div>
          <div class="cassette-label">
            <span>The Smiths</span>
            <span>1986</span>
          </div>
          <div class="cassette-button"></div>
          <div class="cassette-button"></div>
          <div class="cassette-button"></div>
          <div class="cassette-button"></div>
          <div class="cassette-reflections">
            <div></div><div></div><div></div>
          </div>
        </div>
        
        <div class="vinyl-container">
          <div class="vinyl-glow"></div>
          <div class="vinyl">
            <div class="vinyl-grooves">
              <div class="groove"></div>
              <div class="groove"></div>
              <div class="groove"></div>
              <div class="groove"></div>
              <div class="groove"></div>
            </div>
            <div class="vinyl-label">
              <span class="label-text">THE SMITHS</span>
              <span class="label-text">THE QUEEN IS DEAD</span>
              <div class="label-center"></div>
            </div>
          </div>
          <div class="tonearm">
            <div class="tonearm-base"></div>
            <div class="tonearm-arm"></div>
            <div class="tonearm-head"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="car-container">
      <div class="road">
        <div class="road-line"></div>
        <div class="road-line"></div>
        <div class="road-line"></div>
      </div>
      
      <div class="car-glow"></div>
      <div class="car" id="car">
        <div class="car-body">
          <div class="car-roof"></div>
          <div class="car-window-front"></div>
          <div class="car-window-side"></div>
          <div class="car-window-rear"></div>
          <div class="car-grill"></div>
          <div class="car-door">
            <div class="door-handle"></div>
          </div>
          <div class="car-side-molding"></div>
          <div class="car-reflections">
            <div class="reflection"></div>
            <div class="reflection"></div>
          </div>
        </div>
        
        <div class="car-wheel car-wheel-front">
          <div class="wheel-rim">
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
          </div>
          <div class="wheel-hub"></div>
        </div>
        
        <div class="car-wheel car-wheel-rear">
          <div class="wheel-rim">
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
          </div>
          <div class="wheel-hub"></div>
        </div>
        
        <div class="car-light car-light-front">
          <div class="light-beam"></div>
        </div>
        <div class="car-light car-light-rear"></div>
        
        <div class="car-exhaust">
          <div class="exhaust-smoke"></div>
          <div class="exhaust-smoke"></div>
        </div>
      </div>
      
      <div class="car-shadow"></div>
    </div>

    <div class="tap-hint" id="hint">
      <div class="hint-icon">
        <i class="fas fa-hand-point-up"></i>
      </div>
      <span>tap the car to drive</span>
      <div class="hint-pulse"></div>
    </div>

    <div class="text-box-container">
      <div class="text-box-glow"></div>
      <div class="text-box">
        <div class="text-decoration top"></div>
        <div class="text-decoration bottom"></div>
        <div class="text-box-inner">
          <p id="lyric"></p>
          <div class="text-underline">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="vintage-overlay"></div>
      </div>
    </div>

    <div class="audio-controls">
      <button class="control-btn" id="playBtn">
        <i class="fas fa-play"></i>
      </button>
      <button class="control-btn" id="pauseBtn">
        <i class="fas fa-pause"></i>
      </button>
      <button class="control-btn" id="restartBtn">
        <i class="fas fa-redo"></i>
      </button>
      <div class="volume-control">
        <i class="fas fa-volume-up"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.1">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
